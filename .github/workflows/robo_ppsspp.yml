name: Robô PPSSPP Automático

on:
  schedule:
    - cron: '0 */10 * * *'
  workflow_dispatch:
    inputs:
      url_manual:
        description: 'URL do jogo PPSSPP'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  extrair_e_postar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar Dependências e Navegador Playwright
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright
          playwright install chromium

      - name: Executar Robô
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
          BLOGGER_EMAIL: ${{ secrets.BLOGGER_EMAIL }}
        run: |
          if [ -n "${{ github.event.inputs.url_manual }}" ]; then
            python extrair_e_postar.py "${{ github.event.inputs.url_manual }}"
          else
            python extrair_e_postar.py
          fi

      - name: Atualizar lista no GitHub
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add jogos.txt || true
          git commit -m "Auto: Lista de jogos atualizada" || exit 0
          git push
