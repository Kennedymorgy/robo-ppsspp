name: Robô PPSSPP Automático

on:
  schedule:
    # Roda automaticamente a cada 10 horas para verificar links alterados
    - cron: '0 */10 * * *'
  workflow_dispatch:
    inputs:
      url_manual:
        description: 'URL do jogo PPSSPP'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  extrair_e_postar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependências e Playwright
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright beautifulsoup4
          playwright install chromium --with-deps

      - name: Executar Robô Extraidor
        run: |
          if [ -n "${{ github.event.inputs.url_manual }}" ]; then
            # Salva a URL manual no jogos.txt para ficar salva nos próximos ciclos
            echo "${{ github.event.inputs.url_manual }}" >> jogos.txt
            python extrair_e_postar.py "${{ github.event.inputs.url_manual }}"
          else
            python extrair_e_postar.py
          fi

      - name: Salvar e Atualizar jogos.txt no GitHub
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add jogos.txt || true
          git commit -m "Auto: Nova URL adicionada ou lista atualizada" || exit 0
          git push
