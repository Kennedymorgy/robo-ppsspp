name: Robô PPSSPP Solo

on:
  schedule:
    - cron: '0 */10 * * *'  # Roda a cada 10 horas
  workflow_dispatch:
    inputs:
      url_manual:
        description: 'URL do jogo PPSSPP'
        required: false
        default: ''

jobs:
  extrair_ppsspp:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Extração
        run: |
          if [ -n "${{ github.event.inputs.url_manual }}" ]; then
            python extrair_ppsspp.py "${{ github.event.inputs.url_manual }}"
          else
            python extrair_ppsspp.py
          fi

      - name: Atualizar lista de jogos no GitHub
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add jogos.txt || true
          git commit -m "Auto: Atualizado jogos PPSSPP" || exit 0
          git push
